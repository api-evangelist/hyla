name: HYLA
description: 'HYLA (HYLA Mobile) was a mobile device trade-in and reverse-supply-chain
  company that ran buyback, trade-in, and device-recommerce programs for carriers,
  retailers, and manufacturers, reselling and redistributing used smartphones into
  secondary markets. Backed by Kleiner Perkins, it was acquired and its business
  folded into Assurant: its site hylamobile.com now permanently redirects to
  Assurant''s mobile/broadband unit. HYLA is not a public API provider — it publishes
  no developer portal, documentation, or API, so this profile is an identity-only
  company record in the API Evangelist network rather than an API catalog entry.'
